<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f1f5fb">
<title>물리과</title>
<script>
/* 첫 페인트 전에 테마 적용 (깜빡임 방지) */
(function(){try{var t=localStorage.getItem('phys-theme');if(!t)t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=t}catch(e){}})();
(function(){try{var g=JSON.parse(localStorage.getItem('phys-glass2'));if(!g)return;var r=document.documentElement.style;
if(g.t!=null)r.setProperty('--k',Math.max(.12,1.4-1.25*g.t/100).toFixed(3));
if(g.b!=null)r.setProperty('--blur',g.b+'px');
if(g.s!=null)r.setProperty('--spk',(g.s/100*1.1).toFixed(3))}catch(e){}})();
</script>
<style>
/* ───────── Design tokens ───────── */
:root{
  --font:'Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',system-ui,sans-serif;
  --ease:cubic-bezier(.22,.9,.28,1);
  --spring:cubic-bezier(.34,1.5,.52,1);
  --smooth:cubic-bezier(.4,0,.2,1);
  --acc:#4a8af0;           /* 은은한 블루 */
  --acc-rgb:74,138,240;
  --k:.50;--blur:22px;--spk:.66;--g1:#7399d2;--g2:#5a83c4;
}
[data-theme="light"]{
  color-scheme:light;
  --acc:#5b82c0; --acc-rgb:91,130,192;
  --g1:#7399d2; --g2:#5a83c4;
  --bg-a:#f6f9fd; --bg-b:#e3ebf6;
  --ink:#1a2740; --ink-2:#66738c; --accent-ink:#3d66a8;
  --glass-a:rgba(255,255,255,calc(.74*var(--k))); --glass-b:rgba(236,244,255,calc(.30*var(--k)));
  --glass-line:rgba(255,255,255,.95); --glass-edge:rgba(130,160,210,.20);
  --shadow:0 14px 34px -14px rgba(70,100,160,.24), 0 2px 6px rgba(70,100,160,.05);
  --shadow-hi:0 22px 44px -16px rgba(70,100,160,.32), 0 3px 8px rgba(70,100,160,.06);
  --spec:rgba(255,255,255,.7);
  --field:rgba(255,255,255,.55); --field-line:rgba(110,140,190,.26);
  --sheet:rgba(248,251,255,calc(.66*var(--k))); --scrim:rgba(20,32,56,.16);
  --sheet-line:rgba(255,255,255,.9); --rule:rgba(255,255,255,.9);
  --btn-bg:linear-gradient(180deg,rgba(255,255,255,.62),rgba(255,255,255,.32)); --btn-line:rgba(255,255,255,.95); --danger:#e5484d;
  --blob1:#bfd2ee; --blob2:#d3e0f3; --blob3:#c6dff0; --blob-o:.6;
  --chip:rgba(var(--acc-rgb),.11);
  --ok:#1f8a5f; --ok-bg:rgba(52,170,120,.14);
  --warn:#a76a10; --warn-bg:rgba(230,160,40,.18);
  --bad:#c04444; --bad-bg:rgba(220,80,80,.13);
  --sep:rgba(110,140,190,.16);
}
[data-theme="dark"]{
  color-scheme:dark;
  --acc:#aab4c6; --acc-rgb:170,180,198;
  --g1:#636d80; --g2:#4c5567;
  --bg-a:#181a20; --bg-b:#242730;
  --ink:#eceef2; --ink-2:#adb4c0; --accent-ink:#d3d8e2;
  --glass-a:rgba(255,255,255,calc(.21*var(--k))); --glass-b:rgba(255,255,255,calc(.09*var(--k)));
  --glass-line:rgba(255,255,255,.20); --glass-edge:rgba(255,255,255,.06);
  --shadow:0 16px 38px -14px rgba(0,0,0,.7), 0 2px 6px rgba(0,0,0,.25);
  --shadow-hi:0 24px 48px -14px rgba(0,0,0,.8), 0 3px 8px rgba(0,0,0,.3);
  --spec:rgba(255,255,255,.16);
  --field:rgba(255,255,255,.09); --field-line:rgba(255,255,255,.18);
  --sheet:rgba(50,53,62,calc(.98*var(--k))); --scrim:rgba(0,0,0,.5);
  --sheet-line:rgba(255,255,255,.22); --rule:rgba(255,255,255,.12);
  --btn-bg:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.05)); --btn-line:rgba(255,255,255,.20); --danger:#ff8a8a;
  --blob1:#4d5463; --blob2:#373c48; --blob3:#465061; --blob-o:.5;
  --chip:rgba(255,255,255,.09);
  --ok:#74d9ab; --ok-bg:rgba(80,200,150,.16);
  --warn:#f1c673; --warn-bg:rgba(240,190,90,.16);
  --bad:#ff9d9d; --bad-bg:rgba(255,110,110,.16);
  --sep:rgba(255,255,255,.08);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  margin:0;min-height:100dvh;font-family:var(--font);color:var(--ink);
  background:var(--bg-a);
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
a{color:inherit;text-decoration:none}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:14px}

/* ───────── 배경 (유리가 굴절시킬 은은한 빛 덩어리) ───────── */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bg i{position:absolute;border-radius:50%;filter:blur(70px);opacity:var(--blob-o);will-change:transform;transition:opacity .8s}
.bg i:nth-child(1){width:60vmax;height:60vmax;max-width:520px;max-height:520px;left:-18%;top:-10%;background:var(--blob1);animation:drift1 24s ease-in-out infinite alternate}
.bg i:nth-child(2){width:50vmax;height:50vmax;max-width:460px;max-height:460px;right:-20%;top:32%;background:var(--blob2);animation:drift2 28s ease-in-out infinite alternate}
.bg i:nth-child(3){width:44vmax;height:44vmax;max-width:420px;max-height:420px;left:10%;bottom:-14%;background:var(--blob3);animation:drift3 32s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(18vw,14vh) scale(1.15)}}
@keyframes drift2{to{transform:translate(-16vw,-12vh) scale(.9)}}
@keyframes drift3{to{transform:translate(14vw,-16vh) scale(1.2)}}

/* ───────── Liquid Glass ───────── */
.glass{
  position:relative;isolation:isolate;overflow:hidden;
  background:linear-gradient(135deg,var(--glass-a),var(--glass-b));
  -webkit-backdrop-filter:blur(var(--blur)) saturate(180%);backdrop-filter:blur(var(--blur)) saturate(180%);
  border:1px solid var(--glass-edge);
  box-shadow:var(--shadow),inset 0 1.5px 0 var(--glass-line),inset 0 -1px 0 var(--glass-edge),inset 1px 0 0 rgba(255,255,255,.12);
  transition:transform .5s var(--ease),box-shadow .45s var(--ease),background .6s var(--smooth),border-color .6s;
}
/* 마우스를 따라다니는 반사광 */
.glass::before{
  content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;opacity:0;
  background:radial-gradient(220px circle at var(--mx,50%) var(--my,0%),var(--spec),transparent 65%);
  transition:opacity .5s var(--ease);
}
/* 상단 곡면 하이라이트 */
.glass::after{
  content:"";position:absolute;left:8%;right:8%;top:0;height:42%;z-index:-1;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.28),transparent);
  border-radius:0 0 60% 60%/0 0 100% 100%;opacity:calc(.8*var(--spk));
}
[data-theme="dark"] .glass::after{display:none}
[data-theme="dark"] .bg i{opacity:0}
[data-theme="dark"] .glass::before{background:radial-gradient(180px circle at var(--mx,50%) var(--my,0%),rgba(255,255,255,.07),transparent 70%)}
@media (hover:hover){
  .tap:hover{transform:translateY(-3px);box-shadow:var(--shadow-hi),inset 0 1.5px 0 var(--glass-line),inset 0 -1px 0 var(--glass-edge)}
  .tap:hover::before{opacity:calc(var(--spk)*1.5)}
  .tap:hover .chev{transform:translateX(4px);color:var(--accent-ink)}
}
.tap:active{transform:scale(.972);transition-duration:.18s}
.tap{cursor:pointer;user-select:none}

/* ───────── Layout ───────── */
.app{max-width:640px;margin:0 auto;padding:max(26px,env(safe-area-inset-top)) 18px 140px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:20px}
.eyebrow{font-size:13px;font-weight:800;letter-spacing:.13em;color:var(--accent-ink)}
h1{margin:6px 0 0;font-size:40px;line-height:1.15;font-weight:800;letter-spacing:-.02em}
#title{display:inline-block}
#title.swap{animation:titleIn .6s var(--ease) both}
@keyframes titleIn{from{opacity:0;transform:translateY(10px);filter:blur(6px)}}

.icon-btn{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:var(--accent-ink);flex:none}
.icon-btn .ico{grid-area:1/1;display:flex;align-items:center;justify-content:center;width:24px;height:24px;line-height:0;margin:auto;transition:opacity .5s var(--smooth)}
.icon-btn .ico svg{display:block;width:24px;height:24px;margin:0}
[data-theme="light"] .ico.sun{opacity:0}
[data-theme="dark"] .ico.moon{opacity:0}

/* ───────── 화면 전환 / 등장 모션 ───────── */
.rise{opacity:1}
.view.anim .rise{animation:rise .7s var(--ease) both;animation-delay:calc(var(--i,0)*55ms)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
.pop{animation:pop .75s var(--spring) both}
@keyframes pop{from{opacity:0;transform:scale(.88) translateY(10px)}}

/* ───────── 카드/리스트 ───────── */
.hero{border-radius:32px;padding:34px 22px 30px;text-align:center;margin-bottom:30px}
.hero .eyebrow{font-size:13px}
.hero h2{margin:10px 0 8px;font-size:25px;font-weight:800;letter-spacing:-.01em}
.hero p{margin:0 0 18px;color:var(--ink-2);font-size:15.5px}
.hero b{color:var(--accent-ink);font-size:16px;font-weight:800}

.sec-h{display:flex;justify-content:space-between;align-items:center;margin:6px 6px 14px}
.sec-h h2{margin:0;font-size:19px;font-weight:800;letter-spacing:-.01em}
.sec-h a,.link{color:var(--accent-ink);font-size:14.5px;font-weight:700;transition:opacity .25s,transform .35s var(--ease)}
.sec-h a:hover{opacity:.7;transform:translateX(2px)}

.item{display:flex;align-items:center;gap:16px;padding:18px 20px;border-radius:28px;margin-bottom:14px;text-align:left;width:100%}
.item .body{flex:1;min-width:0}
.item .t{font-size:17.5px;font-weight:800;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.item .s{font-size:14.5px;color:var(--ink-2);margin-top:4px;line-height:1.5;overflow:hidden;text-overflow:ellipsis}
.item .s.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.chev{color:var(--ink-2);transition:transform .45s var(--ease),color .3s;opacity:.8}
.chev svg{width:20px;height:20px}
.sq{width:58px;height:58px;border-radius:20px;display:grid;place-items:center;flex:none;font-weight:800;font-size:16px;color:var(--accent-ink);
  background:linear-gradient(145deg,rgba(255,255,255,.85),rgba(255,255,255,.35));box-shadow:inset 0 1px 0 #fff,0 6px 14px -6px rgba(var(--acc-rgb),.35)}
[data-theme="dark"] .sq{background:linear-gradient(145deg,rgba(255,255,255,.16),rgba(255,255,255,.05));box-shadow:inset 0 1px 0 rgba(255,255,255,.22)}
.sq.round{border-radius:50%}
.datebox{width:58px;height:58px;border-radius:20px;display:grid;place-content:center;text-align:center;flex:none;
  background:linear-gradient(145deg,rgba(255,255,255,.85),rgba(255,255,255,.35));box-shadow:inset 0 1px 0 #fff}
[data-theme="dark"] .datebox{background:linear-gradient(145deg,rgba(255,255,255,.16),rgba(255,255,255,.05));box-shadow:inset 0 1px 0 rgba(255,255,255,.22)}
.datebox span{font-size:11px;font-weight:800;color:var(--accent-ink);line-height:1}
.datebox b{font-size:21px;line-height:1.15;font-weight:800}
.past{opacity:.55}

.chip{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:800;background:var(--chip);color:var(--accent-ink);white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.solid{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tile{border-radius:26px;padding:18px;display:flex;flex-direction:column;gap:14px;align-items:flex-start;text-align:left}
.tile .sq{width:46px;height:46px;border-radius:16px}
.tile .t{font-size:16.5px;font-weight:800}
.tile .s{font-size:13.5px;color:var(--ink-2);margin-top:2px}

.empty{border-radius:28px;padding:34px 20px;text-align:center;color:var(--ink-2);font-size:15px}
.empty .btn{margin-top:14px}

/* 툴바 */
.bar{display:flex;gap:10px;align-items:center;margin:0 0 14px}
.search{flex:1;display:flex;align-items:center;gap:10px;padding:0 16px;height:50px;border-radius:999px;color:var(--ink-2)}
.search input{flex:1;min-width:0;border:0;outline:0;background:none;font:inherit;font-size:16px;color:var(--ink)}
.search input::placeholder{color:var(--ink-2);opacity:.8}
.search:focus-within{box-shadow:var(--shadow),0 0 0 4px rgba(var(--acc-rgb),.18),inset 0 1.5px 0 var(--glass-line)}
.add{height:50px;padding:0 18px 0 14px;border-radius:999px;display:flex;align-items:center;gap:6px;font-weight:800;font-size:15px;color:#fff;border:0;
  background:linear-gradient(135deg,var(--g1),var(--g2));box-shadow:0 10px 22px -8px rgba(var(--acc-rgb),.7),inset 0 1.5px 0 rgba(255,255,255,.5)}
.add.glass{background:linear-gradient(135deg,var(--g1),var(--g2))}
.add::before,.add::after{display:none}
.add svg{width:20px;height:20px}
.fchips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 14px;margin:0 -18px;padding-left:18px;padding-right:18px;scrollbar-width:none}
.fchips::-webkit-scrollbar{display:none}
.fchip{flex:none;padding:8px 16px;border-radius:999px;font-size:14px;font-weight:700;color:var(--ink-2);background:var(--field);border:1px solid var(--field-line);
  transition:all .45s var(--ease)}
.fchip:hover{transform:translateY(-1px)}
.fchip:active{transform:scale(.94)}
.fchip.on{color:#fff;background:linear-gradient(135deg,var(--g1),var(--g2));border-color:transparent;box-shadow:0 8px 18px -8px rgba(var(--acc-rgb),.8)}
.summary{display:flex;gap:10px;margin:0 2px 14px;color:var(--ink-2);font-size:13.5px;font-weight:600}
.summary b{color:var(--accent-ink)}
.group-h{margin:20px 6px 10px;font-size:13px;font-weight:800;letter-spacing:.06em;color:var(--accent-ink);display:flex;align-items:center;gap:8px}
.group-h::after{content:"";flex:1;height:1px;background:var(--sep)}

/* 수량 스테퍼 */
.stepper{display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px;background:var(--field);border:1px solid var(--field-line);flex:none}
.stepper button{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--accent-ink);transition:transform .35s var(--spring),background .25s}
.stepper button:hover{background:var(--chip)}
.stepper button:active{transform:scale(.8)}
.stepper svg{width:16px;height:16px;stroke-width:2.4}
.stepper output{min-width:30px;text-align:center;font-weight:800;font-size:15.5px;font-variant-numeric:tabular-nums}
.bump{animation:bump .45s var(--spring)}
@keyframes bump{40%{transform:scale(1.35);color:var(--accent-ink)}}

/* 캘린더 */
.cal{border-radius:30px;padding:16px 14px 12px;margin-bottom:18px}
.cal-h{display:flex;align-items:center;justify-content:space-between;padding:2px 6px 10px}
.cal-h h3{margin:0;font-size:18px;font-weight:800}
.cal-h .nav{display:flex;gap:4px;align-items:center}
.cal-h button{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--accent-ink);transition:background .25s,transform .35s var(--spring)}
.cal-h button:hover{background:var(--chip)}
.cal-h button:active{transform:scale(.85)}
.cal-h button.today-btn{width:auto;padding:0 12px;font-size:13px;font-weight:800}
.cal-h svg{width:18px;height:18px}
.dow,.days{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}
.dow span{font-size:12px;font-weight:700;color:var(--ink-2);padding:4px 0 8px}
.days.go{animation:calIn .5s var(--ease) both}
@keyframes calIn{from{opacity:0;transform:translateX(calc(var(--dir,1)*22px))}}
.day{height:46px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;position:relative;
  transition:background .35s var(--ease),transform .4s var(--spring),color .3s}
.day b{font-size:15px;font-weight:700}
.day:hover{background:var(--chip)}
.day:active{transform:scale(.88)}
.day.today b{color:var(--accent-ink)}
.day.today{box-shadow:inset 0 0 0 1.5px rgba(var(--acc-rgb),.55)}
.day.sel{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;box-shadow:0 8px 18px -8px rgba(var(--acc-rgb),.85);transform:scale(1.04)}
.day.sel b{color:#fff}
.day i{display:flex;gap:3px;height:5px}
.day u{width:5px;height:5px;border-radius:50%;background:var(--acc);display:block;animation:pop .5s var(--spring)}
.day u.e{background:#7dd3e8}
.day.sel u{background:#fff}.day.sel u.e{background:#d3f3ff}
.legend{display:flex;gap:14px;padding:8px 8px 2px;font-size:12px;color:var(--ink-2);font-weight:600}
.legend span::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--acc);margin-right:6px}
.legend span.e::before{background:#7dd3e8}

/* ───────── Dock ───────── */
.dock{position:fixed;z-index:30;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%);
  width:min(calc(100% - 28px),440px);padding:6px;border-radius:999px;display:grid;grid-template-columns:repeat(5,1fr);
  -webkit-backdrop-filter:blur(calc(var(--blur)*1.25)) saturate(190%);backdrop-filter:blur(calc(var(--blur)*1.25)) saturate(190%)}
.dock::after{display:none}
.dock a{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;font-size:11px;font-weight:700;color:var(--ink-2);transition:color .35s var(--smooth)}
.dock a svg{transition:transform .6s var(--spring)}
.dock a:active svg{transform:scale(.8)}
.dock a.on{color:var(--accent-ink)}
.dock a.on svg{transform:translateY(-1px) scale(1.12)}
.ind{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/5);border-radius:999px;
  background:linear-gradient(135deg,rgba(var(--acc-rgb),.20),rgba(var(--acc-rgb),.08));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 6px 16px -8px rgba(var(--acc-rgb),.6);
  transition:transform .7s var(--spring)}
.ind.nt{transition:none}

/* ───────── Sheet ───────── */
.overlay{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;visibility:hidden;
  background:transparent;-webkit-backdrop-filter:blur(0);backdrop-filter:blur(0);
  transition:background .5s var(--smooth),backdrop-filter .5s var(--smooth),-webkit-backdrop-filter .5s var(--smooth),visibility 0s .6s}
.overlay.show{visibility:visible;background:var(--scrim);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition-delay:0s}
.sheet{width:min(calc(100% - 28px),560px);max-height:88dvh;display:flex;flex-direction:column;border-radius:40px;
  margin-bottom:max(14px,env(safe-area-inset-bottom));border:1.5px solid var(--sheet-line);
  background:var(--sheet);-webkit-backdrop-filter:blur(calc(var(--blur)*1.6)) saturate(190%);backdrop-filter:blur(calc(var(--blur)*1.6)) saturate(190%);
  transform:translateY(115%);transition:transform .7s cubic-bezier(.2,.92,.24,1)}
.overlay.show .sheet{transform:none}
.sheet::after{display:none}
.sheet .grab{width:42px;height:5px;border-radius:9px;background:var(--ink-2);opacity:.35;margin:10px auto 0;flex:none;display:none}
.sheet-in{display:flex;flex-direction:column;min-height:0;animation:sIn .5s var(--ease) both}
@keyframes sIn{from{opacity:0;transform:translateY(12px)}}
.sh-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:28px 26px 8px}
.sh-head h3{margin:0;font-size:22px;font-weight:800;letter-spacing:-.01em}
.sh-head .x{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--field);color:var(--ink-2);transition:transform .4s var(--spring),background .25s}
.sh-head .x:hover{transform:rotate(90deg);background:var(--chip)}

@media (min-width:700px){
  .overlay{align-items:center}
  .sheet{margin:0;width:min(100%,560px);border-radius:36px;transform:translateY(24px) scale(.94);opacity:0;transition:transform .65s var(--spring),opacity .4s var(--smooth)}

  .sheet .grab{display:none}

}

.btn{flex:1;height:56px;border-radius:22px;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;
  background:var(--btn-bg);border:1px solid var(--btn-line);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 8px 18px -12px rgba(58,110,200,.35);
  transition:transform .4s var(--spring),box-shadow .35s,background .3s}
.btn:hover{transform:translateY(-2px)}
.btn:disabled{opacity:.4;pointer-events:none}
.btn:active{transform:scale(.96)}
.btn svg{width:19px;height:19px}
.btn.primary{color:#fff;border:0;background:linear-gradient(135deg,var(--g1),var(--g2));box-shadow:0 12px 24px -10px rgba(var(--acc-rgb),.8),inset 0 1.5px 0 rgba(255,255,255,.45)}
.btn.danger{color:var(--danger)}

.kv{display:block;padding-bottom:4px;margin:0}
.kv>div{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:baseline;padding:15px 0;border-bottom:1px solid var(--rule)}
.kv dt{font-size:15px;font-weight:500;color:var(--ink-2)}
.kv dd{margin:0;font-size:16px;font-weight:700;line-height:1.55;white-space:pre-wrap;word-break:keep-all}

.field{margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:800;color:var(--ink-2);margin:0 2px 7px}
.field label em{color:var(--accent-ink);font-style:normal}
.field input,.field textarea,.field select{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--field);
  border:1px solid var(--field-line);border-radius:16px;padding:14px 15px;outline:none;resize:vertical;
  transition:border-color .3s,box-shadow .35s var(--ease),background .3s}
.field textarea{min-height:92px}
.field input:focus,.field textarea:focus{border-color:var(--acc);box-shadow:0 0 0 4px rgba(var(--acc-rgb),.18)}
.field input::placeholder,.field textarea::placeholder{color:var(--ink-2);opacity:.6}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{padding:10px 16px;border-radius:999px;font-size:14.5px;font-weight:700;color:var(--ink-2);background:var(--field);border:1px solid var(--field-line);
  transition:all .45s var(--ease)}
.opt:active{transform:scale(.92)}
.opt.on{color:#fff;background:linear-gradient(135deg,var(--g1),var(--g2));border-color:transparent;box-shadow:0 8px 18px -8px rgba(var(--acc-rgb),.8)}
.hint{font-size:13px;color:var(--ink-2);padding:4px 2px}
.shake{animation:shake .45s var(--ease)}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.confirm-msg{font-size:16px;line-height:1.6;color:var(--ink-2);padding:4px 0 8px}

/* Toast */
.toast{position:fixed;z-index:80;left:50%;bottom:calc(max(16px,env(safe-area-inset-bottom)) + 86px);transform:translate(-50%,30px) scale(.92);opacity:0;pointer-events:none;
  display:flex;align-items:center;gap:14px;padding:12px 14px 12px 20px;border-radius:999px;font-size:14.5px;font-weight:700;white-space:nowrap;
  transition:transform .6s var(--spring),opacity .35s}
.toast.show{transform:translate(-50%,0) scale(1);opacity:1;pointer-events:auto}
.toast button{color:var(--accent-ink);font-weight:800;padding:6px 12px;border-radius:999px;background:var(--chip)}

/* v4: 제목 위치 통일 / 레이아웃 안정화 */
html{scrollbar-gutter:stable;overflow-y:scroll}
.top{min-height:96px;margin-bottom:18px;align-items:flex-start}
.eyebrow{height:28px;display:flex;align-items:center}
h1{margin:2px 0 0;white-space:nowrap}
#view>.sec-h:first-child{margin-top:0}
#list{min-height:46vh}
#list.anim .rise{animation:rise .6s var(--ease) both;animation-delay:calc(var(--i,0)*45ms)}
.day u.e{background:#7fb6cf}
[data-theme="dark"] .day u.e,[data-theme="dark"] .legend span.e::before{background:#d9c9a3}
.legend span.e::before{background:#7fb6cf}
.fchip{padding:8px 15px;font-size:13.5px}
.datebox span{letter-spacing:.06em;font-size:11.5px}
/* 헤더 뒤로가기 */
.eyebrow .back{display:inline-flex;align-items:center;gap:2px;height:28px;padding:0 10px 0 4px;margin:0 0 0 -6px;letter-spacing:0;font-size:13px;border-radius:999px;transition:background .3s,transform .4s var(--spring)}
.eyebrow .back svg{width:16px;height:16px;stroke-width:2.4}
.eyebrow .back:hover{background:var(--chip);transform:translateX(-2px)}
.eyebrow .back:active{transform:scale(.94)}
/* 홈 바로가기 */
.shortcuts{border-radius:32px;padding:14px 10px;margin-bottom:30px}
.sc-grid{display:grid;grid-template-columns:repeat(var(--n,4),1fr);gap:2px}
.sc{display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px 2px 10px;border-radius:24px;font-size:13px;font-weight:800;text-align:center;line-height:1.3;word-break:keep-all;
  transition:background .4s var(--ease),transform .45s var(--spring)}
.sc .sq{width:56px;height:56px;border-radius:20px;transition:transform .55s var(--spring),box-shadow .4s var(--ease)}

@media (hover:hover){.sc:hover{background:var(--chip)}.sc:hover .sq{transform:translateY(-4px) scale(1.07);box-shadow:inset 0 1px 0 #fff,0 14px 22px -10px rgba(var(--acc-rgb),.55)}}
.sc:active{transform:scale(.92)}
/* 설정 */
.set-card{border-radius:30px;padding:20px;margin-bottom:14px}
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:999px;background:var(--field);border:1px solid var(--field-line)}
.seg button{position:relative;z-index:1;height:44px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:800;font-size:15px;color:var(--ink-2);transition:color .4s}
.seg button.on{color:#fff}
.seg button svg{width:19px;height:19px}
.seg-ind{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:999px;background:linear-gradient(135deg,var(--g1),var(--g2));box-shadow:0 8px 18px -8px rgba(var(--acc-rgb),.8),inset 0 1px 0 rgba(255,255,255,.45);transition:transform .7s var(--spring)}
.seg[data-v="dark"] .seg-ind{transform:translateX(100%)}
.slider{margin-top:22px}
.slider .lab{display:flex;justify-content:space-between;align-items:baseline;font-size:15px;font-weight:800}
.slider .lab output{color:var(--accent-ink);font-variant-numeric:tabular-nums;font-size:14.5px}
.slider .ends{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-2);font-weight:600;margin-top:-2px}
.rng{-webkit-appearance:none;appearance:none;width:100%;height:32px;background:none;margin:2px 0 0;cursor:pointer;outline:none}
.rng::-webkit-slider-runnable-track{height:8px;border-radius:99px;background:linear-gradient(90deg,var(--acc) var(--p,50%),var(--field-line) var(--p,50%))}
.rng::-moz-range-track{height:8px;border-radius:99px;background:linear-gradient(90deg,var(--acc) var(--p,50%),var(--field-line) var(--p,50%))}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;margin-top:-10px;border-radius:50%;border:1px solid rgba(255,255,255,.95);
  background:linear-gradient(145deg,#fff,#dfeaff);box-shadow:0 5px 14px rgba(30,70,150,.32),inset 0 1px 0 #fff;transition:transform .4s var(--spring)}
.rng::-moz-range-thumb{width:26px;height:26px;border-radius:50%;border:1px solid rgba(255,255,255,.95);background:linear-gradient(145deg,#fff,#dfeaff);box-shadow:0 5px 14px rgba(30,70,150,.32);transition:transform .4s var(--spring)}
.rng:active::-webkit-slider-thumb{transform:scale(1.2)}
.rng:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 5px rgba(var(--acc-rgb),.25),0 5px 14px rgba(30,70,150,.32)}
.set-note{font-size:13px;color:var(--ink-2);margin:16px 2px 0;line-height:1.5}

/* v5: 필터 칩 줄을 검색줄과 같은 너비로 */
.fchips{margin:0 0 12px;padding:2px 0 12px;gap:6px;overflow-x:auto}
.fchip{flex:1 1 auto;min-width:0;padding:9px 6px;font-size:13px;text-align:center;white-space:nowrap}
/* 로그인 */
body.locked .app,body.locked .dock{opacity:0;visibility:hidden;pointer-events:none;transition:opacity .45s var(--smooth),visibility 0s linear .45s}
.app{transition:opacity .7s var(--smooth),visibility 0s}
.dock{transition:opacity .7s var(--smooth),visibility 0s,background .6s,border-color .6s,box-shadow .45s var(--ease)}
.auth{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto;opacity:0;visibility:hidden;
  transition:opacity .6s var(--smooth),visibility 0s linear .6s}
.auth.show{opacity:1;visibility:visible;transition-delay:0s}
.auth-card{width:min(100%,400px);border-radius:38px;padding:32px 26px 26px;margin:auto}
.auth-card h2{margin:8px 0 4px;font-size:36px;font-weight:800;letter-spacing:-.02em}
.auth-sub{margin:0 0 22px;color:var(--ink-2);font-size:15px}
.auth-card .seg{margin-bottom:6px}
.seg[data-v="signup"] .seg-ind{transform:translateX(100%)}
.fadein{animation:sIn .5s var(--ease) both}
.auth-err{min-height:20px;color:var(--danger);font-size:13.5px;font-weight:700;margin:2px 2px 12px}
.auth-hint{margin-top:16px;font-size:13px;color:var(--ink-2);text-align:center;line-height:1.6}
.auth-hint b{color:var(--accent-ink)}
.auth .btn{width:100%;flex:none}
.auth .opts{margin-bottom:10px}
/* 내 정보 */
.prof{display:flex;align-items:center;gap:16px;margin-bottom:6px}
.prof .sq{width:68px;height:68px;font-size:26px}
.prof .t{font-size:21px;font-weight:800;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.prof .s{color:var(--ink-2);font-size:14.5px;margin-top:3px}
.set-card .kv{margin-top:8px}
.set-card .kv dd .chips{margin-top:0}
.lines{display:flex;flex-direction:column;gap:10px}
.line{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:24px}
.line .nm{font:inherit;font-weight:700;font-size:16px;text-align:left;color:var(--ink);transition:color .3s,transform .4s var(--ease)}
.line .nm:hover{color:var(--accent-ink);transform:translateX(2px)}
.line .nm:active{transform:scale(.97)}
.line .chip{flex:none}
.chip.btnchip{cursor:pointer;border:0;font-family:inherit;padding:6px 12px;font-size:13px;transition:transform .4s var(--spring),background .3s}
.chip.btnchip:hover{transform:translateY(-1px)}
.chip.btnchip:active{transform:scale(.94)}
.mute{color:var(--ink-2);font-weight:500}
.set-card .row2{display:flex;gap:12px;margin-top:14px}
.set-card .row2 .btn{height:52px}

/* v6: 관리자 */
.sh-foot.col .row{width:100%}
.acc-sum{display:flex;gap:14px;margin:0 4px 14px;color:var(--ink-2);font-size:13.5px;font-weight:600}
.acc-sum b{color:var(--accent-ink)}
.sh-body .auth-err{margin:0 2px 4px}
/* ── v7: 다크모드 안정화 ── */
.bg::before,.bg::after{content:"";position:absolute;inset:0;transition:opacity .6s var(--smooth)}
.bg::before{background:linear-gradient(165deg,#f6f9fd,#e3ebf6)}
.bg::after{background:linear-gradient(165deg,#181a20,#242730);opacity:0}
[data-theme="dark"] .bg::before{opacity:0}
[data-theme="dark"] .bg::after{opacity:1}
[data-theme="dark"] .bg i{display:none}
/* 어두운 배경에선 블러가 보이지 않으니 카드의 backdrop-filter를 꺼서 깜빡임/띠 현상 제거 */
[data-theme="dark"] .glass:not(.dock):not(.sheet):not(.toast):not(.auth-card){-webkit-backdrop-filter:none;backdrop-filter:none}

/* ── v7: 일정 구분 ── */
:root{--t-imp:#d4605c;--t-imp-rgb:212,96,92;--t-sch:#5b82c0;--t-sch-rgb:91,130,192;--t-evt:#3f9a93;--t-evt-rgb:63,154,147;--t-cmp:#c48a2c;--t-cmp-rgb:196,138,44}
[data-theme="dark"]{--t-imp:#f08a85;--t-imp-rgb:240,138,133;--t-sch:#aab4c6;--t-sch-rgb:170,180,198;--t-evt:#7fc9c0;--t-evt-rgb:127,201,192;--t-cmp:#e3b86a;--t-cmp-rgb:227,184,106}
.ty-imp{--tc:var(--t-imp);--tc-rgb:var(--t-imp-rgb)}.ty-sch{--tc:var(--t-sch);--tc-rgb:var(--t-sch-rgb)}
.ty-evt{--tc:var(--t-evt);--tc-rgb:var(--t-evt-rgb)}.ty-cmp{--tc:var(--t-cmp);--tc-rgb:var(--t-cmp-rgb)}
.chip.ty{color:var(--tc);background:rgba(var(--tc-rgb),.16)}
.day u{background:var(--tc,var(--acc))}
.legend{flex-wrap:wrap;gap:6px 14px}
.legend span::before{background:var(--tc,var(--acc))}
.day i{gap:2px}
.day u{width:5px;height:5px}
.day.sel u{background:#fff}

/* ── v11: 레이아웃 편집 (관리자) ── */
.pen{width:34px;height:34px;border-radius:50%;display:inline-grid;place-items:center;vertical-align:middle;margin-left:10px;position:relative;top:-3px;color:var(--ink-2);
  background:var(--field);border:1px solid var(--field-line);transition:color .3s,transform .45s var(--spring),background .3s}
.pen[hidden]{display:none}
.pen svg{width:16px;height:16px}
.pen:hover{color:var(--accent-ink);transform:scale(1.1) rotate(-8deg)}
.pen:active{transform:scale(.88)}
.lcard{border-radius:28px;padding:4px 14px;margin-bottom:12px}
.lrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--rule);will-change:transform}
.lrow:last-child{border-bottom:0}

  box-shadow:inset 0 1px 0 rgba(255,255,255,.35);transition:background .25s,color .25s,transform .4s var(--spring),opacity .25s}

.lrow .mv button:active{transform:scale(.82)}

.lrow .sq{width:40px;height:40px;border-radius:14px;flex:none;transition:opacity .35s}

.lin:focus{border-color:var(--acc);box-shadow:0 0 0 4px rgba(var(--acc-rgb),.18)}
.lin::placeholder{color:var(--ink-2);opacity:.6}
.eye{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;flex:none;color:var(--accent-ink);background:var(--chip);transition:background .3s,color .3s,transform .4s var(--spring)}
.eye svg{width:19px;height:19px}

.eye:active{transform:scale(.85)}
.lrow.off .lin,.lrow.off .sq{opacity:.45}
.l-note{font-size:13px;color:var(--ink-2);margin:-4px 6px 12px;line-height:1.5}
.l-sub{display:block;font-size:12.5px;font-weight:700;color:var(--ink-2);margin:12px 2px 6px}
.lcard .lrow.solo{padding:12px 0}
.lcard .lrow.solo .lin{height:46px}

/* 제목이 길어져도 헤더가 깨지지 않게 */
.top>div:first-child{min-width:0;flex:1}
h1{display:flex;align-items:center;min-width:0}

.pen.on{color:#fff;background:linear-gradient(135deg,var(--g1),var(--g2));border-color:transparent}

.eye:disabled{opacity:.3;pointer-events:none}

.frow{display:flex;gap:12px;margin-top:14px}

.lrow.fld .eye{margin-top:2px}
.ipick{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;color:var(--ink-2);background:var(--field);border:1px solid var(--field-line);transition:all .4s var(--ease)}

.mclub{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:8px}

}

/* View transition (테마 전환 원형 리빌) */
::view-transition-group(root){animation-duration:.32s}
::view-transition-old(root),::view-transition-new(root){animation-duration:.32s;animation-timing-function:ease-out;mix-blend-mode:normal}

html.theme-switch *,html.theme-switch *::before,html.theme-switch *::after{transition:none!important}
html.tfade *,html.tfade *::before,html.tfade *::after{transition:background-color .3s ease,color .3s ease,border-color .3s ease,box-shadow .3s ease,opacity .3s ease!important}

@media (max-width:380px){h1{font-size:34px}.item{padding:16px}.sq,.datebox{width:52px;height:52px}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}
  .bg i{animation:none}
}

let DB=load();
function load(){
  try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);KEYS.forEach(k=>{if(!Array.isArray(o[k]))o[k]=(k==='notices'||k==='teachers')?seed()[k]:[]});return migrate(o)}}catch(e){}
  return seed();
}
function migrate(o){
  { const cn=new Set((o.creative||[]).map(c=>c.name)), fn=new Set((o.free||[]).map(c=>c.name));
    (o.members||[]).forEach(m=>{
      if(!Array.isArray(m.clubsC))m.clubsC=[];if(!Array.isArray(m.clubsF))m.clubsF=[];
      if(Array.isArray(m.clubs)){m.clubs.forEach(n=>{const to=(fn.has(n)&&!cn.has(n))?m.clubsF:m.clubsC;if(!to.includes(n))to.push(n)});}
      delete m.clubs;
    });
    const fm=o.layout&&o.layout.fields&&o.layout.fields.members;
    if(fm){const sp=a=>Array.isArray(a)?[...new Set(a.flatMap(k=>k==='clubs'?['clubsC','clubsF']:[k]))]:a;
      if(fm.order)fm.order=sp(fm.order);if(fm.hide)fm.hide=sp(fm.hide);if(fm.label)delete fm.label.clubs}
  }
  o.inventory.forEach(x=>{if(x.status==='수리 중')x.status='수리중'});
  o.events.forEach(e=>{e.type='행사';if(e.desc&&!e.memo)e.memo=e.desc;delete e.desc});
  o.schedule.forEach(x=>{if(!TYPES.includes(x.type))x.type='일정'});
  const oldSample=['오실로스코프','DC 전원공급기','진자 실험 장치','광학 벤치','디지털 멀티미터'];
  if(o.inventory.length&&o.inventory.every(x=>oldSample.includes(x.name)&&!LABS.includes(x.lab)))o.inventory=seed().inventory;
  else o.inventory.forEach(x=>{if(!LABS.includes(x.lab))x.lab=LABS[0]});
  return o;
}

const DOCK_OF={fields:4,layout:4,home:0,info:1,members:1,rne:1,creative:1,free:1,events:1,notices:1,teachers:1,schedule:2,inventory:3,settings:4,admin:4};
const SUB={members:1,teachers:1,rne:1,creative:1,free:1,events:1,notices:1};
TITLES.layout='레이아웃 편집';TITLES.fields='입력칸 편집';
/* ── 레이아웃 설정 (관리자가 수정): 기본값 위에 덮어쓰는 방식 ── */
const EYEBROW_DEF='PHYSICS DEPARTMENT';
const DOCK_DEF={home:'홈',info:'정보',schedule:'일정',inventory:'연구실',settings:'설정'};
const INFO_DEF=['members','teachers','rne','creative','free','events','notices'];
const INFO_ICON={members:'users',teachers:'cap',rne:'flask',creative:'atom',free:'spark',events:'flag',notices:'mega'};
const SC_DEF=['info','schedule','inventory','settings'];
const SC_ICON={info:'info',schedule:'calendar',inventory:'flask',settings:'sliders'};
const HOME_DEF=['notices','events'];
const HOME_ICON={notices:'mega',events:'flag'};
const isCustom=k=>typeof k==='string'&&k.startsWith('c_');
const customIds=()=>L().custom.map(c=>c.id);
const SEC_DEF={get info(){return [...INFO_DEF,...customIds()]},sc:SC_DEF,home:HOME_DEF};
const RENAMEABLE=['home','info','members','teachers','rne','creative','free','events','notices','schedule','inventory','settings'];
function L(){
  if(!DB.layout||typeof DB.layout!=='object'||Array.isArray(DB.layout))DB.layout={};
  const l=DB.layout;['titles','dock','order','hide','fields'].forEach(k=>{if(!l[k]||typeof l[k]!=='object'||Array.isArray(l[k]))l[k]={}});if(!Array.isArray(l.custom))l.custom=[];if(!l.gone||typeof l.gone!=='object'||Array.isArray(l.gone))l.gone={};return l;
}
const T=k=>L().titles[k]||TITLES[k]||'';
const DL=k=>L().dock[k]||DOCK_DEF[k];
const EY=()=>L().eyebrow||EYEBROW_DEF;
const goneIn=(sec,k)=>Array.isArray(L().gone[sec])&&L().gone[sec].includes(k);
const goneList=sec=>(Array.isArray(L().gone[sec])?L().gone[sec]:[]).filter(k=>SEC_DEF[sec].includes(k));
function orderOf(sec){const def=SEC_DEF[sec],o=Array.isArray(L().order[sec])?L().order[sec].filter(k=>def.includes(k)):[];return [...new Set([...o,...def])].filter(k=>!goneIn(sec,k))}
const GONE_ICON={sc:()=>SC_ICON,home:()=>HOME_ICON,info:()=>INFO_ICON};
const GONE_LABEL={sc:'홈 바로가기',home:'홈 구성',info:'메뉴'};
const isHidden=(sec,k)=>Array.isArray(L().hide[sec])&&L().hide[sec].includes(k);
/* 제목/하단바/소제목을 화면에 반영 (애니메이션 없이) */
/* ── 입력칸(필드) 스키마: 기본 필드 위에 관리자 설정을 덮어씌움 ── */
const TYPE_LABEL={text:'한 줄 글',area:'여러 줄 글',number:'숫자',date:'날짜',time:'시간',chips:'선택 (하나)',multi:'선택 (여러 개)'};
const FT=[['text','한 줄 글'],['area','여러 줄 글'],['number','숫자'],['date','날짜'],['time','시간'],['chips','선택 (하나)'],['multi','선택 (여러 개)']];
const fkey=k=>k==='events'?'schedule':k;
const FNAME=k=>k==='schedule'?'일정 · 행사':k==='inventory'?'연구실 물품':T(k);
function fieldsOf(key,withHidden){
  const base=(C[key]&&C[key].fields)||[];
  const ov=L().fields[fkey(key)]||{};
  const custom=(Array.isArray(ov.custom)?ov.custom:[]).map(f=>({...f,custom:1}));
  const all=[...base,...custom], ord=Array.isArray(ov.order)?ov.order:[];
  const rank=k=>{const i=ord.indexOf(k);return i<0?1e6+all.findIndex(f=>f.k===k):i};
  return [...all].sort((a,b)=>rank(a.k)-rank(b.k)).map(f=>({...f,
    l:(ov.label&&ov.label[f.k])||f.l,
    hidden:!f.req&&Array.isArray(ov.hide)&&ov.hide.includes(f.k)})).filter(f=>withHidden||!f.hidden);
}
function fov(key){const l=L().fields,k=fkey(key);if(!l[k]||typeof l[k]!=='object')l[k]={};const o=l[k];
  if(!Array.isArray(o.custom))o.custom=[];if(!Array.isArray(o.hide))o.hide=[];if(!Array.isArray(o.order))o.order=[];if(!o.label||typeof o.label!=='object')o.label={};return o}
/* ── 관리자가 만든 메뉴(컬렉션)를 앱 구조에 등록 ── */
function syncCustom(){
  const ids=customIds();
  Object.keys(C).filter(k=>isCustom(k)&&!ids.includes(k)).forEach(k=>{delete C[k];delete PAGES[k];delete TITLES[k];delete SUB[k];delete INFO_ICON[k];delete DOCK_OF[k]});
  L().custom.forEach(c=>{
    if(!Array.isArray(DB[c.id]))DB[c.id]=[];
    TITLES[c.id]=c.name;SUB[c.id]=1;INFO_ICON[c.id]=c.icon||'layout';DOCK_OF[c.id]=1;
    C[c.id]={get label(){return T(c.id)},fields:[{k:'name',l:'이름',t:'text',req:1,ph:'이름'},{k:'memo',l:'메모',t:'area',ph:'내용을 적어주세요'}],title:i=>i.name};
    PAGES[c.id]=()=>`${toolbar(c.id,'검색')}<div id="list"></div>`;
  });
}
function rowHTML(sec,k,i,len,o){
  const off=o.eye&&isHidden(sec,k);
  return `<div class="lrow ${off?'off':''}" data-flip="${sec}:${k}">
    <div class="mv"><button data-act="lmove" data-sec="${sec}" data-k="${k}" data-d="-1" ${i===0?'disabled':''} aria-label="위로 이동">${ic('arrU')}</button>
    <button data-act="lmove" data-sec="${sec}" data-k="${k}" data-d="1" ${i===len-1?'disabled':''} aria-label="아래로 이동">${ic('arrD')}</button></div>
    <span class="sq">${ic(o.icon||'layout')}</span>
    <input class="lin" data-sc="title" data-k="${k}" value="${esc(T(k))}" maxlength="24" placeholder="${esc(TITLES[k]||'')}" aria-label="이름">
    ${o.fields?`<button class="mini ic" data-act="fedit" data-k="${k}" aria-label="입력칸 편집">${ic('sliders')}<span>입력칸</span></button>`:''}
    ${o.eye?`<button class="eye ${off?'off':''}" data-act="lhide" data-sec="${sec}" data-k="${k}" aria-label="${off?'표시하기':'숨기기'}">${ic(off?'eyeoff':'eye')}</button>`:''}
    ${o.del?`<button class="eye del" data-act="mdel" data-sec="${sec}" data-k="${k}" aria-label="삭제">${ic('trash')}</button>`:''}</div>`;
}
function goneCard(secs,i0){
  const blocks=secs.map(sec=>{const g=goneList(sec);if(!g.length)return '';
    return (secs.length>1?`<label class="l-sub">${GONE_LABEL[sec]}</label>`:'')+g.map(k=>`<div class="lrow gone"><span class="sq">${ic((GONE_ICON[sec]()[k])||'layout')}</span>
      <div class="fbody"><span style="font-weight:800;font-size:15.5px">${esc(T(k))}</span></div>
      <button class="mini" data-act="lrestore" data-sec="${sec}" data-k="${k}">${ic('reset')}복원</button></div>`).join('')}).join('');
  if(!blocks)return '';
  return `<div class="sec-h rise" style="--i:${i0};margin-top:22px"><h2>삭제한 항목</h2></div><div class="glass lcard rise" style="--i:${i0+1}">${blocks}</div>`;
}
function menuRows(){const a=orderOf('info');return a.map((k,i)=>rowHTML('info',k,i,a.length,{icon:INFO_ICON[k],eye:true,fields:true,del:true})).join('')||'<div class="l-note" style="margin:14px 4px">남은 메뉴가 없어요.</div>'}
function chrome(r){
  r=r||route();
  const ttl=r==='fields'?`${FNAME(state.fk)} 입력칸`:T(r);
  $('#title').textContent=ttl;
  { const n=[...ttl].length; $('#title').parentElement.dataset.len=n>14?'xl':n>8?'l':''; }
  const bk=r==='fields'?['layout',TITLES.layout]:(r==='admin'||r==='layout')?['settings',T('settings')]:SUB[r]?['info',T('info')]:null;
  $('#eyebrow').innerHTML=bk?`<a class="back" href="#/${bk[0]}">${ic('left')}${esc(bk[1])}</a>`:esc(EY());
  document.title=r==='home'?T('home'):`${ttl} · ${T('home')}`;
  $$('#dock a').forEach((a,n)=>{const d=DOCK[n];if(!d)return;const sp=$('span',a);if(sp)sp.textContent=DL(d[0]);a.setAttribute('aria-label',DL(d[0]))});
  const pen=$('#penBtn');if(pen){pen.hidden=!(isAdmin()&&RENAMEABLE.includes(r));if(!pen.innerHTML)pen.innerHTML=ic('edit')}
  const eb=$('#editBtn');if(eb){eb.hidden=!(isAdmin()&&r==='info');if(!eb.innerHTML)eb.innerHTML=ic('layout');eb.classList.toggle('on',!!state.editMenu)}
  const ae=$('#authEyebrow'),at=$('#authTitle');if(ae)ae.textContent=EY();if(at)at.textContent=T('home');
}

/* ═════════ 카드 렌더러 ═════════ */
const CHEV=`<span class="chev">${ic('chev')}</span>`;
const open=(key,id)=>`role="button" tabindex="0" data-act="open" data-key="${key}" data-id="${id}"`;
const sortDate=(a,b)=>(a.date+(a.start||''))<(b.date+(b.start||''))?-1:1;
const notesSorted=()=>[...DB.notices].sort((a,b)=>((b.level==='중요')-(a.level==='중요'))||(a.date<b.date?1:-1));
const timeText=s=>s.start?(s.end?`${s.start} – ${s.end}`:s.start):'종일';
const MON=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
function dateBox(s){const d=parse(s);return `<div class="datebox"><span>${MON[d.getMonth()]}</span><b>${d.getDate()}</b></div>`}
function statusCls(s){return s==='양호'||s==='완료'?'ok':s==='점검 필요'?'warn':s==='주문 필요'||s==='수리중'?'bad':''}

const R={
  members:(m,i)=>`<div class="glass item tap rise" style="--i:${i}" ${open('members',m.id)}>
    <div class="sq round">${esc((m.name||'?').slice(0,1))}</div>
    <div class="body"><div class="t">${esc(m.name)} <span class="chip ${m.role==='부장'?'solid':''}">${esc(m.role)}</span></div>
    ${m.grade?`<div class="s">${esc(m.grade)}</div>`:''}
    ${[['창체',m.clubsC],['자율',m.clubsF]].map(([lb,a])=>(a||[]).length?`<div class="mclub"><span>${lb}</span>${a.map(c=>`<span class="chip">${esc(c)}</span>`).join('')}</div>`:'').join('')}</div>${CHEV}</div>`,
  events:(e,i)=>R.sch('events')(e,i),
  schedule:(e,i)=>R.sch('schedule')(e,i),
  sch:key=>(x,i)=>{const ty=tp(x), multi=x.until&&x.until>x.date, sub=[multi?`${md(x.date)} ~ ${md(x.until)}`:'',timeText(x),x.place].filter(Boolean).join(' · ');
    return `<div class="glass item tap rise ${isPast(x)?'past':''}" style="--i:${i}" ${open(key,x.id)}>
    ${dateBox(x.date)}<div class="body"><div class="t">${esc(x.title)} <span class="chip ty ty-${TK[ty]}">${ty}</span><span class="chip">${ddayItem(x)}</span></div>
    <div class="s">${esc(sub)}</div></div>${CHEV}</div>`},
  teachers:(t,i)=>`<div class="glass item tap rise" style="--i:${i}" ${open('teachers',t.id)}>
    <div class="sq round">${esc((t.name||'?').slice(0,1))}</div>
    <div class="body"><div class="t">${esc(t.name)}</div>
    ${t.duty?`<div class="s">${esc(t.duty)}</div>`:''}
    ${(t.labs||[]).length?`<div class="chips">${t.labs.map(l=>`<span class="chip">${esc(l)}</span>`).join('')}</div>`:''}</div>${CHEV}</div>`,
  rne:(r,i)=>`<div class="glass item tap rise" style="--i:${i}" ${open('rne',r.id)}>
    <div class="sq">${esc(r.team)}</div>
    <div class="body"><div class="t">${esc(r.title)}</div>
    <div class="s">${[r.leader?`조장 ${esc(r.leader)}`:'',r.members?`조원 ${esc(r.members)}`:'',r.teacher?`지도 ${esc(r.teacher)}`:''].filter(Boolean).join('<br>')}</div></div>${CHEV}</div>`,
  notices:(n,i)=>`<div class="glass item tap rise" style="--i:${i}" ${open('notices',n.id)}>
    <div class="sq">${ic('mega')}</div>
    <div class="body"><div class="t">${esc(n.title)} ${n.level==='중요'?'<span class="chip bad">중요</span>':''}</div>
    ${n.body?`<div class="s clamp">${esc(n.body)}</div>`:''}
    <div class="s" style="font-size:13px;margin-top:3px">${fmtDate(n.date)}</div></div>${CHEV}</div>`,
  club:(key)=>(c,i)=>`<div class="glass item tap rise" style="--i:${i}" ${open(key,c.id)}>
    <div class="sq">${esc((c.name||'?').slice(0,1))}</div>
    <div class="body"><div class="t">${esc(c.name)}</div>
    ${c.leader?`<div class="s">${key==='creative'?'부장':'회장'} ${esc(c.leader)}</div>`:''}
    ${c.activity?`<div class="s clamp">${esc(c.activity)}</div>`:''}</div>${CHEV}</div>`,
  inv:(x,i)=>`<div class="glass item tap rise" style="--i:${i}" ${open('inventory',x.id)}>
    <div class="body"><div class="t">${esc(x.name)} ${x.status?`<span class="chip ${statusCls(x.status)}">${esc(x.status)}</span>`:''}</div>
    ${x.memo?`<div class="s clamp">${esc(x.memo)}</div>`:''}</div>
    <div class="stepper" aria-label="수량 조절">
      <button data-act="qty" data-id="${x.id}" data-d="-1" aria-label="수량 감소">${ic('minus')}</button>
      <output id="q-${x.id}">${x.qty??0}</output>
      <button data-act="qty" data-id="${x.id}" data-d="1" aria-label="수량 증가">${ic('plus')}</button>
    </div></div>`
};
R.cust=key=>(x,i)=>{
  const t=C[key].title(x);
  const extra=fieldsOf(key).filter(f=>f.k!=='name'&&x[f.k]!==undefined&&x[f.k]!==''&&!(Array.isArray(x[f.k])&&!x[f.k].length)).slice(0,2);
  return `<div class="glass item tap rise" style="--i:${i}" ${open(key,x.id)}>
    <div class="sq">${esc((t||'?').slice(0,1))}</div>
    <div class="body"><div class="t">${esc(t)}</div>
    ${extra.map(f=>`<div class="s clamp">${esc(f.l)} · ${esc(fmtVal(f,x[f.k]))}</div>`).join('')}</div>${CHEV}</div>`};
R.acc=(a,i)=>`<div class="glass item tap rise" style="--i:${i}" role="button" tabindex="0" data-act="accopen" data-id="${a.uid}">
    <div class="sq round">${esc((a.name||'?').slice(0,1))}</div>
    <div class="body"><div class="t">${esc(a.name)} ${a.role==='admin'?'<span class="chip solid">관리자</span>':''}${a.uid===SESSION?'<span class="chip">나</span>':''}</div>
    <div class="s">학번 ${esc(a.sid)}<br>${esc(a.email)}</div></div>${CHEV}</div>`;
const rowFor=key=>key==='creative'||key==='free'?R.club(key):R[key];
const empty=(msg,key)=>`<div class="glass empty rise">${msg}${key?`<br><button class="btn primary" data-act="add" data-key="${key}" style="display:inline-flex;padding:0 22px;flex:none">${ic('plus')}추가하기</button>`:''}</div>`;
const match=(o,q)=>!q||Object.values(o).join(' ').toLowerCase().includes(q.toLowerCase());

/* ═════════ 페이지 ═════════ */
function toolbar(key,ph){
  return `<div class="bar rise"><label class="glass search">${ic('search')}<input id="q" type="search" placeholder="${ph}" value="${esc(state.q[key]||'')}" data-key="${key}" autocomplete="off"></label>
  <button class="glass add tap" data-act="add" data-key="${key}">${ic('plus')}추가</button></div>`;
}
const PAGES={
  home(){
    const show=DB.events.filter(x=>!isPast(x)).sort(sortDate).slice(0,3);
    const nt=notesSorted().slice(0,3);
    const sc=to=>`<a class="sc" href="#/${to}"><span class="sq">${ic(SC_ICON[to])}</span><span>${esc(T(to))}</span></a>`;
    let n=2;
    const SECT={
      notices:()=>{const i=n;n+=4;return `<div class="sec-h rise" style="--i:${i}"><h2>${esc(T('notices'))}</h2>${goneIn('info','notices')?'':'<a href="#/notices">전체 보기</a>'}</div>
        ${nt.length?nt.map((x,k)=>R.notices(x,i+1+k)).join(''):empty('등록된 공지사항이 없어요.','notices')}`},
      events:()=>{const i=n;n+=4;return `<div class="sec-h rise" style="--i:${i}"><h2>${esc(T('events'))}</h2>${goneIn('info','events')?'':'<a href="#/events">전체 보기</a>'}</div>
        ${show.length?show.map((x,k)=>R.events(x,i+1+k)).join(''):empty('다가오는 행사가 없어요.','events')}`}
    };
    const secs=orderOf('home').filter(k=>!isHidden('home',k)).map((k,idx)=>`<div ${idx?'style="margin-top:26px"':''}>${SECT[k]()}</div>`).join('');
    const scs=orderOf('sc');
    if(!scs.length&&!secs)return empty('홈에 표시할 내용이 없어요.'+(isAdmin()?'<br><span style="font-size:13px">설정 → 레이아웃 편집에서 삭제한 항목을 복원할 수 있어요.</span>':''));
    return `${scs.length?`<section class="glass shortcuts rise"><div class="sc-grid" style="--n:${scs.length}">${scs.map(sc).join('')}</div></section>`:''}${secs}`;
  },
  members(){
    return `${toolbar('members','이름, 학년, 동아리 검색')}<div id="list"></div>`;
  },
  events(){return `${toolbar('events','행사명, 장소 검색')}<div id="list"></div>`},
  notices(){return `${toolbar('notices','제목, 내용 검색')}<div id="list"></div>`},
  teachers(){return `${toolbar('teachers','이름, 담당 검색')}<div id="list"></div>`},
  admin(){return `<div class="bar rise"><label class="glass search">${ic('search')}<input id="q" type="search" placeholder="이름, 학번, 이메일 검색" value="${esc(state.q.admin||'')}" data-key="admin" autocomplete="off"></label></div><div id="list"></div>`},
  rne(){return `${toolbar('rne','주제, 조, 이름 검색')}<div id="list"></div>`},
  creative(){return `${toolbar('creative','동아리, 부원 검색')}<div id="list"></div>`},
  free(){return `${toolbar('free','동아리, 부원 검색')}<div id="list"></div>`},
  inventory(){
    const labs=['전체',...LABS];
    if(!labs.includes(state.lab))state.lab='전체';
    return `${toolbar('inventory','물품, 연구실, 메모 검색')}
    <div class="fchips rise" id="labs">${labs.map(l=>`<button class="fchip ${l===state.lab?'on':''}" data-act="lab" data-lab="${esc(l)}">${esc(l)}</button>`).join('')}</div>
    <div id="list"></div>`;
  },
  schedule(){
    const {y,m}=state.cal;
    return `<section class="glass cal rise">
      <div class="cal-h"><h3 id="calTitle">${y}년 ${m+1}월</h3>
        <div class="nav"><button class="today-btn" data-act="cal" data-d="0">오늘</button>
        <button data-act="cal" data-d="-1" aria-label="이전 달">${ic('left')}</button><button data-act="cal" data-d="1" aria-label="다음 달">${ic('chev')}</button></div></div>
      <div class="dow">${DOW.map(d=>`<span>${d}</span>`).join('')}</div>
      <div class="days" id="days">${calBody()}</div>
      <div class="legend">${TYPES.map(t=>`<span class="ty-${TK[t]}">${t}</span>`).join('')}</div></section>
    ${toolbar('schedule','일정 제목, 장소 검색')}<div id="list"></div>`;
  },
  info(){
    const row=(to,t,s,i)=>`<a class="glass item tap rise" style="--i:${i}" href="#/${to}"><div class="sq">${ic(INFO_ICON[to]||'layout')}</div><div class="body"><div class="t">${esc(t)}</div><div class="s">${s}</div></div>${CHEV}</a>`;
    const lead=DB.members.filter(m=>m.role==='부장').map(m=>m.name).join(', ');
    const SUBT={
      members:()=>`${DB.members.length}명${lead?` · 부장 ${esc(lead)}`:''}`,
      teachers:()=>`${DB.teachers.length}명`,
      rne:()=>`${DB.rne.length}개 조`,
      creative:()=>`${DB.creative.length}개`,

/* 리스트 채우기 (검색/필터 반영) */
function fillList(){
  const el=$('#list');if(!el)return;
  const r=route(), q=(state.q[r]||'').trim(); let h='';
  if(r==='members'){
    const arr=[...DB.members].sort((a,b)=>(a.role===b.role?0:a.role==='부장'?-1:1)||a.name.localeCompare(b.name,'ko'))
      .filter(m=>match({...m,clubsC:(m.clubsC||[]).join(' '),clubsF:(m.clubsF||[]).join(' ')},q));
    h=arr.length?arr.map((m,i)=>R.members(m,i)).join(''):empty(q?'검색 결과가 없어요.':'아직 구성원이 없어요.',q?'':'members');
  }else if(isCustom(r)&&C[r]){
    const arr=DB[r].filter(x=>match(x,q));
    h=arr.length?arr.map((x,i)=>R.cust(r)(x,i)).join(''):empty(q?'검색 결과가 없어요.':'아직 등록된 항목이 없어요.',q?'':r);
  }else if(r==='teachers'){
    const arr=[...DB.teachers].sort((a,b)=>a.name.localeCompare(b.name,'ko')).filter(x=>match({...x,labs:(x.labs||[]).join(' ')},q));
    h=arr.length?arr.map((x,i)=>R.teachers(x,i)).join(''):empty(q?'검색 결과가 없어요.':'등록된 선생님이 없어요.',q?'':'teachers');
  }else if(r==='events'){
    const arr=DB.events.filter(x=>!isPast(x)&&match(x,q)).sort(sortDate);
    h=arr.length?arr.map((x,i)=>R.events(x,i)).join(''):empty(q?'검색 결과가 없어요.':'다가오는 행사가 없어요.<br><span style="font-size:13px">지난 행사는 일정 달력에서 확인할 수 있어요.</span>',q?'':'events');
  }else if(r==='schedule'){
    const all=[...DB.schedule.map(x=>({x,k:'schedule'})),...DB.events.map(x=>({x,k:'events'}))].filter(o=>match(o.x,q));
    const srt=(a,b)=>sortDate(a.x,b.x);
    if(state.sel){
      const arr=all.filter(o=>covers(o.x,state.sel)).sort(srt);
      h=`<div class="group-h">${fmtDate(state.sel)}<button class="link" data-act="day" data-day="${state.sel}" style="margin-left:auto;order:2">전체 보기</button></div>`+
        (arr.length?arr.map((o,i)=>R.sch(o.k)(o.x,i)).join(''):empty('이 날은 등록된 일정이 없어요.'));
    }else{
      const arr=all.filter(o=>!isPast(o.x)).sort(srt);
      h=arr.length?arr.map((o,i)=>R.sch(o.k)(o.x,i)).join(''):empty(q?'검색 결과가 없어요.':'다가오는 일정이 없어요.<br><span style="font-size:13px">지난 일정은 달력에서 날짜를 눌러 확인할 수 있어요.</span>',q?'':'schedule');
    }
  }else if(r==='admin'){
    const arr=ACCS.filter(a=>match({n:a.name,s:a.sid,e:a.email,r:a.role==='admin'?'관리자':''},q))
      .sort((a,b)=>((b.role==='admin')-(a.role==='admin'))||a.name.localeCompare(b.name,'ko'));
    h=`<div class="acc-sum rise"><span>전체 <b>${ACCS.length}</b>명</span><span>관리자 <b>${adminCount()}</b>명</span></div>`+
      (arr.length?arr.map((a,i)=>R.acc(a,i)).join(''):empty('검색 결과가 없어요.'));
  }else if(r==='notices'){
    const arr=notesSorted().filter(x=>match(x,q));
    h=arr.length?arr.map((x,i)=>R.notices(x,i)).join(''):empty(q?'검색 결과가 없어요.':'등록된 공지사항이 없어요.',q?'':'notices');
  }else if(r==='rne'){
    const arr=DB.rne.filter(x=>match(x,q));
    h=arr.length?arr.map((x,i)=>R.rne(x,i)).join(''):empty(q?'검색 결과가 없어요.':'등록된 R&E 연구가 없어요.',q?'':'rne');
  }else if(r==='creative'||r==='free'){
    const arr=DB[r].filter(x=>match(x,q));
    h=arr.length?arr.map((x,i)=>R.club(r)(x,i)).join(''):empty(q?'검색 결과가 없어요.':'등록된 동아리가 없어요.',q?'':r);
  }else if(r==='inventory'){
    const arr=DB.inventory.filter(x=>(state.lab==='전체'||x.lab===state.lab)&&match(x,q));
    const total=arr.reduce((s,x)=>s+(+x.qty||0),0);
    const summary=`<div class="summary rise"><span>품목 <b id="sumN">${arr.length}</b></span><span>총 수량 <b id="sumQ">${total}</b></span></div>`;
    if(!arr.length)h=summary+empty(q?'검색 결과가 없어요.':(state.lab==='전체'?'등록된 물품이 없어요.':`${esc(state.lab)}에 등록된 물품이 없어요.`),q?'':'inventory');
    else{
      let n=0;
      if(state.lab==='전체'){
        h=summary+LABS.map(lab=>{const items=arr.filter(x=>x.lab===lab);return items.length?`<div class="group-h rise" style="--i:${n}">${esc(lab)} · ${items.length}</div>`+items.map(x=>R.inv(x,++n)).join(''):''}).join('');
      }else h=summary+arr.map(x=>R.inv(x,++n)).join('');
    }
  }
  el.innerHTML=h;
  if(state.fresh){const f=$(`[data-id="${state.fresh}"]`,el);if(f&&!reduced){f.classList.add('pop');f.scrollIntoView({block:'center',behavior:'smooth'})}state.fresh=null}
}

/* 캘린더 */
function calBody(){
  const {y,m}=state.cal, first=new Date(y,m,1).getDay(), n=new Date(y,m+1,0).getDate(), mk={};
  const put=(x)=>{const t=tp(x);let d=parse(x.date);const e=parse(lastDay(x));for(let c=0;d<=e&&c<370;c++,d.setDate(d.getDate()+1)){(mk[ymd(d)]=mk[ymd(d)]||new Set()).add(t)}};
  DB.schedule.forEach(put);DB.events.forEach(put);
  let h='';for(let i=0;i<first;i++)h+='<span></span>';
  for(let d=1;d<=n;d++){const k=`${y}-${pad(m+1)}-${pad(d)}`,set=mk[k];
    const dots=set?TYPES.filter(t=>set.has(t)).map(t=>`<u class="ty-${TK[t]}"></u>`).join(''):'';
    h+=`<button class="day${k===today()?' today':''}${k===state.sel?' sel':''}" data-act="day" data-day="${k}" aria-label="${m+1}월 ${d}일"><b>${d}</b><i>${dots}</i></button>`}
  return h;
}
function refreshCal(dir){
  const el=$('#days');if(!el)return;
  el.innerHTML=calBody();$('#calTitle').textContent=`${state.cal.y}년 ${state.cal.m+1}월`;
  if(dir){el.style.setProperty('--dir',dir);el.classList.remove('go');void el.offsetWidth;el.classList.add('go')}
}

/* ═════════ 라우팅/렌더 ═════════ */
const fromHash=()=>{let r='home';try{r=decodeURIComponent(location.hash).replace(/^#\/?/,'')||'home'}catch(e){}return PAGES[r]?r:'home'};
syncCustom();
let CUR=fromHash();
const route=()=>CUR;
/* 주소(#)에 의존하지 않는 화면 이동 — 미리보기/내장 뷰어에서도 '페이지 없음'이 뜨지 않도록 */
function nav(r){
  if(!PAGES[r])r='home';
  closeSheet();
  if(r===CUR){window.scrollTo({top:0,behavior:'smooth'});return}
  CUR=r;
  try{history.pushState({r},'','#/'+r)}catch(e){}
  render(true);
}
let animTimer;
function render(anim=false){
  syncCustom();
  if((CUR==='admin'||CUR==='layout'||CUR==='fields')&&!isAdmin())CUR='home';
  if(CUR==='fields'&&!(state.fk&&C[state.fk]))CUR='layout';
  if(SUB[CUR]&&goneIn('info',CUR))CUR='info';
  const r=route(), view=$('#view');
  if(r!=='info')state.editMenu=false;
  chrome(r);
  if(anim){
    const t=$('#title');t.classList.remove('swap');void t.offsetWidth;t.classList.add('swap');
    view.classList.add('anim');clearTimeout(animTimer);animTimer=setTimeout(()=>view.classList.remove('anim'),1400);
    window.scrollTo({top:0,behavior:'instant'});
  }
  view.innerHTML=PAGES[r]();
  fillList();
  if(r==='settings')syncGlassUI();
  if(r==='home'&&state.fresh){const f=$(`[data-id="${state.fresh}"]`);if(f)f.classList.add('pop');state.fresh=null}
  setDock(r,!anim);
}
function setDock(r,instant){
  const i=DOCK_OF[r]??0, ind=$('#ind');
  $$('#dock a').forEach((a,n)=>a.classList.toggle('on',n===i));
  if(instant&&ind.classList.contains('nt')){ind.style.transform=`translateX(${i*100}%)`;return}
  ind.classList.remove('nt');ind.style.transform=`translateX(${i*100}%)`;
}
function buildDock(){
  $('#dock').insertAdjacentHTML('beforeend',DOCK.map(d=>`<a href="#/${d[0]}" aria-label="${esc(DL(d[0]))}">${ic(d[2])}<span>${esc(DL(d[0]))}</span></a>`).join(''));
  $('#icoMoon').innerHTML=`<svg class="i" viewBox="0 0 24 24">${ICON.moon}</svg>`;
  $('#icoSun').innerHTML=`<svg class="i" viewBox="0 0 24 24">${ICON.sun}</svg>`;
}

/* ═════════ Sheet ═════════ */
const overlay=$('#overlay'), sheet=$('#sheet');
let ctx=null;
function openSheet(html){
  sheet.innerHTML=`<div class="grab"></div><div class="sheet-in">${html}</div>`;
  overlay.classList.add('show');overlay.setAttribute('aria-hidden','false');document.body.classList.add('lock');
}
function closeSheet(){overlay.classList.remove('show');overlay.setAttribute('aria-hidden','true');document.body.classList.remove('lock');ctx=null}
function swapSheet(html){sheet.innerHTML=`<div class="grab"></div><div class="sheet-in">${html}</div>`}

function fmtVal(f,v){
  if(Array.isArray(v))return v.join(', ');
  if(f.t==='date')return fmtDate(v);
  if(f.k==='qty')return `${v}개`;
  return v;
}
function openDetail(key,id,fresh){
  const it=DB[key].find(x=>x.id===id);if(!it)return;
  ctx={key,id};
  const rows=fieldsOf(key).map(f=>{const v=it[f.k];const s=(v===undefined||v===null||v===''||(Array.isArray(v)&&!v.length))?'':fmtVal(f,v);return s?`<div><dt>${f.l}</dt><dd>${esc(s)}</dd></div>`:''}).join('');
  const html=`<div class="sh-head"><h3>${esc(C[key].title(it))}</h3></div>
    <div class="sh-body"><dl class="kv" style="margin:0">${rows||'<div><dd>내용이 없어요.</dd></div>'}</dl></div>

function fieldHTML(f,v){
  const val=v===undefined?(typeof f.d==='function'?f.d():(f.d??'')):v;
  const lab=`<label>${f.l}${f.req?' <em>*</em>':''}</label>`;
  let c='';
  if(f.t==='area')c=`<textarea data-k="${f.k}" placeholder="${esc(f.ph||'')}">${esc(val)}</textarea>`;
  else if(f.t==='chips'||f.t==='multi'){
    let o=typeof f.o==='function'?f.o():f.o;
    const sel=f.t==='multi'?(Array.isArray(val)?val:[]):[val];
    if(f.t==='multi')o=[...new Set([...o,...sel])];
    c=o.length?`<div class="opts" data-k="${f.k}" data-t="${f.t}">${o.map(x=>`<button type="button" class="opt ${sel.includes(x)?'on':''}" data-act="opt" data-v="${esc(x)}">${esc(x)}</button>`).join('')}</div>`
      :`<div class="hint">${esc(f.empty||'선택지가 없어요.')}</div>`;
  }else{
    const extra=f.t==='number'?'min="0" inputmode="numeric"':'';
    const dl=f.list?`list="dl-${f.k}"`:'';
    c=`<input data-k="${f.k}" type="${f.t}" value="${esc(val)}" placeholder="${esc(f.ph||'')}" ${extra} ${dl} autocomplete="off">${f.list?`<datalist id="dl-${f.k}">${f.list().map(x=>`<option value="${esc(x)}">`).join('')}</datalist>`:''}`;
  }
  return `<div class="field">${lab}${c}</div>`;

/* 주의: 서버가 없는 프로토타입이라 계정·권한이 이 기기(브라우저)에만 저장되고, 권한 검사도 화면 단에서만 이뤄져요.
   실제 보안(다른 기기 로그인, 우회 방지)은 서버를 붙이는 단계에서 적용합니다. */

let SESSION=null, KEEP=true, authMode='login', busy=false;
const rnd=()=>{try{const a=new Uint8Array(8);crypto.getRandomValues(a);return [...a].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return Math.random().toString(16).slice(2,18)}};
const canSubtle=()=>{try{return !!(crypto&&crypto.subtle&&crypto.subtle.digest)}catch(e){return false}};
async function hashPw(pw,salt,alg){
  const bytes=[...unescape(encodeURIComponent(salt+':'+pw))].map(c=>c.charCodeAt(0));
  if(alg==='s'){
    if(!canSubtle())throw new Error('nosubtle');
    const b=await crypto.subtle.digest('SHA-256',new Uint8Array(bytes));
    return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
  }
  let h=2166136261;for(const c of bytes){h^=c;h=Math.imul(h,16777619)}return (h>>>0).toString(16);
}
async function makeAcc({sid,name,email,pw,role,memberId}){
  const salt=rnd(), alg=canSubtle()?'s':'f';
  return {uid:'u'+rnd(),sid,name,email:email.toLowerCase(),role:role||'user',memberId:memberId||null,salt,alg,hash:await hashPw(pw,salt,alg),created:Date.now()};
}

function unlock(acc){
  SESSION=acc.uid;
  try{localStorage.removeItem('phys-session');sessionStorage.removeItem('phys-session');(KEEP?localStorage:sessionStorage).setItem('phys-session',acc.uid)}catch(e){}
  $('#auth').classList.remove('show');document.body.classList.remove('locked');

}

  closeSheet();authMode='login';drawAuth();chrome();document.body.classList.add('locked');$('#auth').classList.add('show');
}
async function submitAuth(){
  if(busy)return;
  const form=$('#authForm'), btn=$('#authGo'), g=n=>form.elements[n]?form.elements[n].value:'';
  const sid=g('sid').replace(/\s/g,''), pw=g('password');
  busy=true;if(btn){btn.disabled=true;btn.textContent='확인 중…'}
  try{
    if(authMode==='login'){
      if(!sid||!pw)return authError('학번과 비밀번호를 입력해 주세요.');
      const acc=ACCS.find(a=>a.sid===sid);
      if(!acc||(await hashPw(pw,acc.salt,acc.alg))!==acc.hash)return authError('학번 또는 비밀번호가 올바르지 않아요.');
      unlock(acc);toast(`${acc.name}님, 환영해요`);return;
    }
    const name=g('name').trim(), email=g('email').trim().toLowerCase();
    if(!okSid(sid))return authError('학번은 숫자 4~10자리로 입력해 주세요.');
    if(!name)return authError('이름을 입력해 주세요.');
    if(!okEmail(email))return authError(emailMsg());
    if(pw.length<4)return authError('비밀번호는 4자 이상이어야 해요.');
    if(pw!==g('password2'))return authError('비밀번호가 서로 달라요.');
    if(ACCS.some(a=>a.sid===sid))return authError('이미 가입된 학번이에요.');
    if(ACCS.some(a=>a.email===email))return authError('이미 사용 중인 이메일이에요.');
    let m=DB.members.find(x=>x.name===name&&!ACCS.some(a=>a.memberId===x.id));
    if(!m){m={id:uid(),name,role:'부원',grade:'',clubsC:[],clubsF:[]};DB.members.push(m);save()}
    const acc=await makeAcc({sid,name,email,pw,role:'user',memberId:m.id});ACCS.push(acc);saveAcc();
    unlock(acc);toast('회원가입을 완료했어요');
  }catch(err){
    authError(err&&err.message==='nosubtle'?'이 환경에서는 계정 확인을 할 수 없어요. 브라우저에서 파일을 직접 열어 주세요.':'문제가 생겼어요: '+(err&&err.message||err));
  }finally{busy=false;const b=$('#authGo');if(b){b.disabled=false;b.textContent=authMode==='signup'?'회원가입':'로그인'}}
}
async function bootAuth(){
  try{await ensureSeedAccounts()}catch(e){}
  let sid=null;try{sid=localStorage.getItem('phys-session')||sessionStorage.getItem('phys-session')}catch(e){}
  const acc=ACCS.find(a=>a.uid===sid);
  drawAuth();
  if(acc){SESSION=acc.uid;document.body.classList.remove('locked');render(true)}
  else $('#auth').classList.add('show');
}

function flipRender(){
  const first={};$$('#view [data-flip]').forEach(e=>{first[e.dataset.flip]=e.getBoundingClientRect().top});
  render();
  if(reduced)return;
  $$('#view [data-flip]').forEach(e=>{
    const f=first[e.dataset.flip];if(f==null||!e.animate)return;
    const dy=f-e.getBoundingClientRect().top;if(Math.abs(dy)<1)return;
    e.animate([{transform:`translateY(${dy}px)`},{transform:'none'}],{duration:480,easing:'cubic-bezier(.34,1.3,.52,1)'});
  });
}
function layMove(sec,k,d){
  if(!isAdmin()||!SEC_DEF[sec])return;
  const a=orderOf(sec),i=a.indexOf(k),j=i+d;if(i<0||j<0||j>=a.length)return;
  [a[i],a[j]]=[a[j],a[i]];L().order[sec]=a;save();flipRender();
}
function layHide(sec,k){
  if(!isAdmin()||!SEC_DEF[sec])return;

function layName(scope,k,val){
  if(!isAdmin())return;
  val=String(val||'').trim().slice(0,scope==='dock'?8:scope==='eyebrow'?30:24);

  if(scope==='title'){const def=TITLES[k];if(!val||val===def)delete l.titles[k];else l.titles[k]=val}
  else if(scope==='dock'){if(!val||val===DOCK_DEF[k])delete l.dock[k];else l.dock[k]=val}
  else if(scope==='eyebrow'){if(!val||val===EYEBROW_DEF)delete l.eyebrow;else l.eyebrow=val}

  $$('#view .lin').forEach(i=>{

    if(scope==='dock'&&i.dataset.sc==='dock'&&i.dataset.k===k)i.value=DL(k);

      <div class="field"><label>입력 형태</label><div class="opts" data-k="ftype" data-t="chips">${FT.map((t,i)=>`<button type="button" class="opt ${i===0?'on':''}" data-act="opt" data-v="${t[1]}">${t[1]}</button>`).join('')}</div></div>
      <div id="fOptWrap" style="display:none">${af('선택지','fo','text','쉼표로 구분 (예: 가, 나, 다)','off')}</div>
      <div class="auth-err" id="sErr" role="alert"></div></div>
    <div class="sh-foot"><button class="btn" data-act="close">취소</button><button class="btn primary" data-act="fsave">추가</button></div>`);
  setTimeout(()=>{const i=$('#sheet [name="fl"]');if(i)i.focus({preventScroll:true})},480);
}
function fieldAddSave(){
  if(!isAdmin()||!ctx||!ctx.fadd)return;
  const fk=ctx.fadd,label=sv('fl').slice(0,20);if(!label)return sErr('입력칸 이름을 입력해 주세요.');
  const tl=($('#sheet .opts[data-k="ftype"] .opt.on')||{dataset:{}}).dataset.v, ft=(FT.find(x=>x[1]===tl)||FT[0])[0];
  const f={k:'x_'+uid(),l:label,t:ft};
  if(ft==='chips'||ft==='multi'){const o=csv(sv('fo'));if(!o.length)return sErr('선택지를 한 개 이상 적어 주세요.');f.o=[...new Set(o)]}
  fov(fk).custom.push(f);save();closeSheet();render();toast('입력칸을 추가했어요');
}
function fldMove(k,d){
  if(!isAdmin()||!state.fk)return;
  const keys=fieldsOf(state.fk,true).map(f=>f.k),i=keys.indexOf(k),j=i+d;if(i<0||j<0||j>=keys.length)return;
  [keys[i],keys[j]]=[keys[j],keys[i]];fov(state.fk).order=keys;save();flipRender();
}
function fldHide(k){
  if(!isAdmin()||!state.fk)return;
  const o=fov(state.fk);o.hide=o.hide.includes(k)?o.hide.filter(x=>x!==k):[...o.hide,k];save();render();
}
function fldLabel(k,val){
  if(!isAdmin()||!state.fk)return;
  val=String(val||'').trim().slice(0,20);const o=fov(state.fk);
  const f=fieldsOf(state.fk,true).find(x=>x.k===k);const baseF=((C[state.fk]||{}).fields||[]).find(x=>x.k===k);
  const def=baseF?baseF.l:(o.custom.find(x=>x.k===k)||{}).l;
  if(f&&f.custom){const c=o.custom.find(x=>x.k===k);if(c&&val)c.l=val}
  else if(!val||val===def)delete o.label[k];else o.label[k]=val;
  save();const inp=$(`#view .lin[data-sc="flabel"][data-k="${k}"]`);if(inp)inp.value=(fieldsOf(state.fk,true).find(x=>x.k===k)||{}).l||'';
  toast('입력칸 이름을 바꿨어요');
}
function fldOpts(k,val){
  if(!isAdmin()||!state.fk)return;
  const c=fov(state.fk).custom.find(x=>x.k===k);if(!c)return;
  const o=[...new Set(csv(val))];
  if(!o.length){toast('선택지는 한 개 이상 필요해요');render();return}
  c.o=o;save();toast('선택지를 바꿨어요');
}
function fldDel(k){
  if(!isAdmin()||!state.fk)return;
  const fk=state.fk,f=fieldsOf(fk,true).find(x=>x.k===k);if(!f||!f.custom)return;
  confirmSheet('입력칸 삭제',`'${esc(f.l)}' 입력칸을 삭제할까요?<br>이미 입력된 값은 화면에서 보이지 않게 돼요.`,'삭제',()=>{
    const o=fov(fk);o.custom=o.custom.filter(x=>x.k!==k);o.order=o.order.filter(x=>x!==k);o.hide=o.hide.filter(x=>x!==k);delete o.label[k];
    save();render();toast('입력칸을 삭제했어요')});
}
function fldReset(){
  if(!isAdmin()||!state.fk)return;
  confirmSheet('기본 구성으로','이 메뉴의 입력칸 이름·순서·숨김·추가한 칸이 처음 상태로 돌아가요.','되돌리기',()=>{delete L().fields[fkey(state.fk)];save();render();toast('기본 구성으로 되돌렸어요')});
}
function delMenu(sec,k){
  if(!isAdmin()||!SEC_DEF[sec]||(sec==='sc'&&k==='settings'))return;
  if(isCustom(k)){state.fk=k;custDel();return}
  const name=T(k);
  const msg=sec==='info'?`'${esc(name)}' 메뉴를 삭제할까요?<br>목록에서 사라지지만 이미 입력한 데이터는 보관돼요. 설정 → 레이아웃 편집의 '삭제한 항목'에서 복원할 수 있어요.`
    :sec==='home'?`홈 화면에서 '${esc(name)}' 구역을 삭제할까요?<br>데이터는 그대로이고 '삭제한 항목'에서 복원할 수 있어요.`
    :`홈 바로가기에서 '${esc(name)}'을(를) 삭제할까요?<br>하단 바에서는 그대로 쓸 수 있고, '삭제한 항목'에서 복원할 수 있어요.`;
  confirmSheet('삭제',msg,'삭제',()=>{
    const g=L().gone;g[sec]=[...(g[sec]||[]).filter(x=>x!==k),k];save();render();
    toast(`'${name}' 삭제됨`,()=>{const g2=L().gone;g2[sec]=(g2[sec]||[]).filter(x=>x!==k);save();render()});
  });
}
function restoreMenu(sec,k){
  if(!isAdmin()||!SEC_DEF[sec])return;
  const g=L().gone;g[sec]=(g[sec]||[]).filter(x=>x!==k);save();render();toast(`'${T(k)}' 복원했어요`);
}
function custDel(){
  if(!isAdmin()||!isCustom(state.fk))return;
  const id=state.fk,c=L().custom.find(x=>x.id===id);if(!c)return;
  confirmSheet('메뉴 삭제',`'${esc(T(id))}' 메뉴와 안에 입력된 항목 ${(DB[id]||[]).length}개가 모두 삭제돼요. 되돌릴 수 없어요.`,'삭제',()=>{
    const l=L();l.custom=l.custom.filter(x=>x.id!==id);delete DB[id];delete l.titles[id];delete l.fields[id];
    Object.keys(l.order).forEach(sec=>{l.order[sec]=l.order[sec].filter(x=>x!==id)});Object.keys(l.hide).forEach(sec=>{l.hide[sec]=l.hide[sec].filter(x=>x!==id)});
    const onFields=route()==='fields';state.fk=null;save();syncCustom();if(onFields)nav('layout');else render();toast('메뉴를 삭제했어요')});
}

/* ═════════ Init ═════════ */
buildDock();
render(true);
bootAuth();
requestAnimationFrame(()=>requestAnimationFrame(()=>{const ind=$('#ind');ind.classList.remove('nt')}));
</script>
</body>
</html>
